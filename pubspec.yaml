name: share_harbor
description: A durable inbound share inbox for Flutter on Android and iOS with transactional delivery guarantees.
version: 0.1.2
repository: https://github.com/rayanMS1122/share_harbor
issue_tracker: https://github.com/rayanMS1122/share_harbor/issues
license: BSD-3-Clause

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  pigeon: ^22.7.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.rayan.share_harbor
        pluginClass: ShareHarborPlugin
      ios:
        pluginClass: ShareHarborPlugin
